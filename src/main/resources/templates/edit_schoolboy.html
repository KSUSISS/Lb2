<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8"/>
    <title>Данные школьника</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card shadow">
                <div class="card-header bg-primary text-white py-3">
                    <h4 class="mb-0">Заполнение данных школьника</h4>
                </div>
                <div class="card-body p-4">
                    <form action="#" th:action="@{/update}" th:object="${schoolboy}" method="post">
                        <!-- Скрытое поле ID[cite: 1] -->
                        <input type="hidden" th:field="*{id}"/>

                        <div class="row mb-3">
                            <div class="col-md-4">
                                <label class="form-label fw-bold">Фамилия</label>
                                <input type="text" class="form-control" placeholder="Иванов" th:field="*{surname}"/>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label fw-bold">Имя</label>
                                <input type="text" class="form-control" placeholder="Иван" th:field="*{name}"/>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label fw-bold">Отчество</label>
                                <input type="text" class="form-control" placeholder="Иванович" th:field="*{patronymic}"/>
                            </div>
                        </div>

                        <div class="row mb-3">
                            <div class="col-md-4">
                                <label class="form-label fw-bold">Национальность</label>
                                <input type="text" class="form-control" th:field="*{nationality}"/>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label fw-bold">Пол</label>
                                <input type="text" class="form-control" placeholder="М / Ж" th:field="*{gender}"/>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label fw-bold">Дата рождения</label>
                                <input type="date" class="form-control" th:field="*{birthDate}"/>
                            </div>
                        </div>

                        <div class="row mb-3">
                            <div class="col-md-6">
                                <label class="form-label fw-bold">Рост (см)</label>
                                <input type="number" class="form-control" th:field="*{height}"/>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-bold">Вес (кг)</label>
                                <input type="number" step="0.1" class="form-control" th:field="*{weight}"/>
                            </div>
                        </div>

                        <div class="row mb-4">
                            <div class="col-md-6">
                                <label class="form-label fw-bold">Моб. телефон</label>
                                <input type="text" class="form-control" placeholder="+7 (999) 000-00-00" th:field="*{phoneNumber}"/>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-bold">Дом. телефон</label>
                                <input type="text" class="form-control" th:field="*{homePhone}"/>
                            </div>
                        </div>

                        <hr class="mb-4">

                        <div class="d-flex justify-content-between">
                            <a th:href="@{/}" class="btn btn-secondary">Отмена</a>
                            <div>
                                <button type="reset" class="btn btn-outline-secondary me-2">Очистить</button>
                                <button type="submit" class="btn btn-success">Сохранить данные</button>
                            </div>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
