<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8"/>
    <title>Список школьников</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container mt-5">
    <h1 class="mb-4 text-center">Учет школьников</h1>

    <div class="mb-3">
        <a th:href="@{/add}" class="btn btn-primary shadow-sm">Добавить школьника</a>
    </div>

    <div class="card shadow-sm">
        <div class="card-body p-0">
            <table class="table table-hover table-striped mb-0">
                <thead class="table-dark">
                <tr>
                    <!-- Колонку ID убрали, добавили больше данных -->
                    <th class="ps-4">Фамилия</th>
                    <th>Имя</th>
                    <th>Отчество</th>
                    <th>Дата рождения</th>
                    <th>Телефон</th>
                    <th class="text-center">Действия</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="boy : ${schoolboys}">
                    <!-- Данные школьника -->
                    <td class="ps-4 fw-bold" th:text="${boy.surname}"></td>
                    <td th:text="${boy.name}"></td>
                    <td th:text="${boy.patronymic}"></td>
                    <td th:text="${boy.birthDate}"></td>
                    <td th:text="${boy.phoneNumber}"></td>

                    <td class="text-center">
                        <a th:href="@{'/update/' + ${boy.id}}" class="btn btn-sm btn-outline-success me-2">Редактировать</a>

                        <a th:href="@{'/delete/' + ${boy.id}}" class="btn btn-sm btn-outline-danger">Удалить</a>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
</body>
</html>
