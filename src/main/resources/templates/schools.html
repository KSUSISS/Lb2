<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{portal :: head('Школы')}"><title>Школы</title></head>
<body>
<div class="layout">
    <aside th:replace="~{portal :: sidebar('schools')}"></aside>
    <main class="workspace">
        <header class="page-header">
            <div>
                <h1>Школы</h1>
                <p>Список школ, к которым привязаны школьники.</p>
            </div>
            <a class="button button-primary" th:href="@{/schools/new}" sec:authorize="hasRole('ADMIN')"><span aria-hidden="true">+</span> Добавить школу</a>
        </header>

        <section class="panel" aria-labelledby="schools-heading">
            <div class="panel-heading">
                <h2 id="schools-heading">Список школ</h2>
                <span class="count" th:text="${'Записей: ' + #lists.size(schools)}"></span>
            </div>
            <div class="table-scroll">
                <table aria-labelledby="schools-heading">
                    <thead>
                    <tr>
                        <th class="id-column" scope="col">ID</th>
                        <th scope="col">Название школы</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="school : ${schools}">
                        <td class="identifier" th:text="${school.id}"></td>
                        <td class="record-name" th:text="${school.name}"></td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(schools)}">
                        <td class="empty-state" colspan="2">Школ пока нет.</td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </section>
    </main>
</div>
</body>
</html>
